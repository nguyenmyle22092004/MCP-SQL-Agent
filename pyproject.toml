[project]
name = "house-price-sql-agent"
version = "0.1.0"
description = "House Price SQL Agent with PostgreSQL, MCP, LangGraph, and tracing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "python-dotenv>=1.0.1",
  "sqlalchemy>=2.0.30",
  "sqlglot>=26.0.0",
  "psycopg[binary]>=3.1.19",
  "langgraph>=0.2.52",
  "langchain>=0.3.4",
  "langchain-anthropic>=0.3.0",
  "mcp>=1.6.0",
  "httpx>=0.27.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "mcp_servers", "decision_layer", "decision_layer.local"]
